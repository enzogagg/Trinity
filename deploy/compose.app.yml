services:
  api:
    image: ${CI_REGISTRY_IMAGE}/api:${TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      trinity:
        aliases: [api-${COLOR}]
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 3s
      retries: 10
  web:
    image: ${CI_REGISTRY_IMAGE}/web:${TAG}
    restart: unless-stopped
    networks:
      trinity:
        aliases: [web-${COLOR}]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      retries: 10
networks:
  trinity:
    external: true
