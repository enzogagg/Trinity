name: trinity-infra
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [trinity]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  proxy:
    image: nginx:1.27-alpine
    container_name: trinity-proxy
    restart: unless-stopped
    ports: ["80:80"]
    volumes: [proxy_active:/etc/nginx/active]
    configs:
      - source: proxy_conf
        target: /etc/nginx/conf.d/default.conf
    networks: [trinity]
configs:
  proxy_conf:
    content: |
      server {
        listen 80;
        resolver 127.0.0.11 valid=5s;
        include /etc/nginx/active/*.conf;
        location /api/ { proxy_pass http://api-$$color:8080; }
        location / { proxy_pass http://web-$$color:80; }
      }
volumes:
  pgdata:
  proxy_active:
networks:
  trinity:
    name: trinity
