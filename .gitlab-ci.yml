# Une seule pipeline par commit : pipeline de MR si une MR est ouverte, sinon pipeline de branche
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  # un nouveau push annule les jobs encore en cours de l'ancien commit
  interruptible: true

stages: [security, lint, test, build, deploy, verify]

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --verbose .

# --- Modèles -----------------------------------------------------------------

.go:
  image: golang:1.27-alpine
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: { files: [api/go.sum] }
    paths: [.go/pkg/mod/]

.web:
  image: node:22-alpine
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key: { files: [web/package-lock.json] }
    paths: [.npm/]
  before_script:
    - cd web
    - npm ci --prefer-offline --no-audit --no-fund

# --- Lint --------------------------------------------------------------------

lint-api:
  stage: lint
  needs: [{ job: gitleaks, artifacts: false }]
  image: golangci/golangci-lint:v2.15.0
  script:
    - cd api
    # texte dans les logs + rapport Code Quality affiché dans les merge requests
    - golangci-lint run --output.text.path=stdout --output.code-climate.path=gl-code-quality-report.json ./...
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      codequality: api/gl-code-quality-report.json

lint-web:
  stage: lint
  needs: [{ job: gitleaks, artifacts: false }]
  extends: .web
  script:
    # tsc --noEmit (types) puis ESLint
    - npm run lint

# --- Tests -------------------------------------------------------------------

test-api:
  stage: test
  needs: [{ job: gitleaks, artifacts: false }]
  extends: .go
  script:
    - go install github.com/jstemmer/go-junit-report/v2@v2.1.0
    - go install github.com/boumenot/gocover-cobertura@v1.5.0
    - cd api
    # on garde le code retour de go test pour publier le rapport JUnit avant d'échouer
    - go test -v -coverprofile=coverage.out ./... > test-output.txt 2>&1 || TEST_STATUS=$?
    - cat test-output.txt
    - $GOPATH/bin/go-junit-report -in test-output.txt > report.xml
    - '[ -z "$TEST_STATUS" ] || exit "$TEST_STATUS"'
    - go tool cover -func=coverage.out
    - $GOPATH/bin/gocover-cobertura < coverage.out > coverage.xml
  coverage: '/^total:\s+\(statements\)\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: api/report.xml
      coverage_report:
        coverage_format: cobertura
        path: api/coverage.xml

test-web:
  stage: test
  needs: [{ job: gitleaks, artifacts: false }]
  extends: .web
  script:
    - npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=report.xml
  coverage: '/^Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: web/report.xml
      coverage_report:
        coverage_format: cobertura
        path: web/coverage/cobertura-coverage.xml

# --- Build -------------------------------------------------------------------

.build:
  stage: build
  image: docker:27
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$COMPONENT:$CI_COMMIT_SHORT_SHA"
    - docker build --pull -f $COMPONENT/Dockerfile.prod -t "$IMAGE" $COMPONENT
    - docker push "$IMAGE"
    # artifact dotenv : référence immuable (digest) de l'image poussée, transmise au déploiement
    - echo "${VAR_NAME}=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")" | tee build.env
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: build.env

build-api:
  extends: .build
  # ne dépend que du lint et des tests de l'API (pas besoin de leurs rapports)
  needs:
    - { job: lint-api, artifacts: false }
    - { job: test-api, artifacts: false }
  variables: { COMPONENT: api, VAR_NAME: API_IMAGE }

build-web:
  extends: .build
  needs:
    - { job: lint-web, artifacts: false }
    - { job: test-web, artifacts: false }
  variables: { COMPONENT: web, VAR_NAME: WEB_IMAGE }

# --- Deploy ------------------------------------------------------------------

deploy-prod:
  stage: deploy
  image: docker:27
  # récupère API_IMAGE et WEB_IMAGE depuis les artifacts dotenv des builds
  needs:
    - { job: build-api, artifacts: true }
    - { job: build-web, artifacts: true }
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' }]
  environment: production
  # ne jamais interrompre une bascule blue/green en cours
  interruptible: false
  variables: { TAG: $CI_COMMIT_SHORT_SHA }
  script:
    - echo "deploying $API_IMAGE and $WEB_IMAGE"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - sh deploy/deploy.sh

# --- Verify ------------------------------------------------------------------

verify-prod:
  stage: verify
  image: docker:27
  needs: [{ job: deploy-prod, artifacts: false }]
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' }]
  interruptible: false
  script:
    # test de fumée à travers le proxy : web, API et connexion PostgreSQL
    - docker exec trinity-proxy wget -qO- http://127.0.0.1/ > /dev/null
    - docker exec trinity-proxy wget -qO- http://127.0.0.1/api/health
    - docker exec trinity-proxy wget -qO- http://127.0.0.1/api/health/db
